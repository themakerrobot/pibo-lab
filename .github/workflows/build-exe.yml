name: Build PiboLab.exe

on:
  push:
    tags: ['v*']        # 예: git tag v0.2 && git push origin v0.2
  workflow_dispatch:     # Actions 탭에서 수동 실행도 가능

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write    # Release에 exe 첨부용
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Stage site files
        run: |
          mkdir -p build/site
          rsync -a \
            --exclude='.git' --exclude='.github' --exclude='dist' --exclude='tools' --exclude='build' \
            --exclude='deploy.bat' --exclude='deploy-exe.bat' --exclude='run.bat' --exclude='server.ps1' \
            --exclude='*.zip' --exclude='*.exe' --exclude='index.html.bak' --exclude='.gitignore' --exclude='README.md' \
            ./ build/site/
          cp tools/portable/main.go tools/portable/go.mod build/

      - name: Build exe
        run: cd build && GOOS=windows GOARCH=amd64 go build -ldflags="-s -w" -o PiboLab.exe .

      - name: Upload artifact (수동 실행용)
        uses: actions/upload-artifact@v4
        with:
          name: PiboLab
          path: build/PiboLab.exe

      - name: Attach to Release (태그 push 시)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: build/PiboLab.exe
