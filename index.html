<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PIBO 체험툴</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header>
  <h1>PIBO 체험툴</h1>
  <span class="badge" id="statusBadge">준비</span>
  <span style="flex:1"></span>
  <a class="navlink" href="dev.html">블록 개발툴 &#x2192;</a>
</header>

<div class="main">
  <div class="left">
    <div class="sec">
      <div class="sec-title">뷰</div>
      <select class="tl-select" id="themeSel" style="width:100%;margin-bottom:5px"><option value="desk">배경: 책상</option><option value="dining">배경: 식탁</option><option value="bench">배경: 작업대</option><option value="road">배경: 주행 매트</option><option value="sumo">배경: 스모 링</option><option value="plain">배경: 심플</option></select>
      <button class="tb on" id="gridBtn"><span class="ic">&#x22DE;</span>그리드</button>
      <button class="tb" id="ssBtn"><span class="ic">&#x1F4F7;</span>스크린샷</button>
    </div>
    <div class="sec">
      <div class="sec-title">포즈</div>
      <button class="tb" id="resetBtn"><span class="ic">&#x21BA;</span>리셋</button>
    </div>
    <div class="sec">
      <div class="sec-title">LCD</div>
      <input type="text" id="lcdText" placeholder="Hi, pibo" style="width:100%;padding:6px 8px;background:var(--panel2);border:1px solid var(--line-soft);border-radius:2px;font-size:11px;color:var(--ink);outline:none;font-family:var(--mono);margin-bottom:5px">
      <div style="display:flex;align-items:center;gap:6px;font-size:10px;color:var(--ink3)"><span>글씨색</span><input type="color" id="lcdColor" value="#ffffff" style="flex:1;height:26px;border:1px solid var(--line-soft);border-radius:2px;background:var(--panel2);cursor:pointer;padding:2px"></div>
    </div>
    <div class="sec">
      <div class="sec-title">안경</div>
      <div style="display:flex;gap:5px"><input type="color" id="glassColorL" value="#00e1ff" title="왼쪽 눈"  style="flex:1;height:30px;border:1px solid var(--line-soft);border-radius:2px;background:var(--panel2);cursor:pointer;padding:2px"><input type="color" id="glassColorR" value="#00e1ff" title="오른쪽 눈" style="flex:1;height:30px;border:1px solid var(--line-soft);border-radius:2px;background:var(--panel2);cursor:pointer;padding:2px"></div>
    </div>
    <div class="sec">
      <div class="sec-title">물리 시뮬</div>
      <button class="tb" id="physBtn" disabled><span class="ic">&#x25CF;</span>물리 ON/OFF</button>
      <div class="info-row"><span>엔진</span><span class="info-val" id="physEngine">로딩중</span></div>
      <div class="info-row"><span>상태</span><span class="info-val" id="physState">OFF</span></div>
      <div class="info-row"><span>기울기</span><span class="info-val" id="physTilt">-</span></div>
      <div class="info-row"><span>이동거리</span><span class="info-val" id="physDist">-</span></div>
    </div>
    <div class="sec" id="partColorSec" style="display:none">
      <div class="sec-title">파트 색상</div>
      <div id="partColors"></div>
      <button class="tb" id="partResetBtn" style="margin-top:6px"><span class="ic">&#x21BA;</span>색상 되돌리기</button>
    </div>
    <div class="sec" id="infoSec" style="display:none"><div id="infoRows"></div></div>
  </div>

  <div class="viewport" id="vp">
    <canvas id="cv"></canvas>
    <div class="empty-msg" id="emptyMsg">
      <div class="em-icon">&#x1F916;</div>
      <p class="em-msg">data/ 에서 모델을 불러옵니다<br><span style="font-size:10px;color:#B0B7BE">실패 시 새로고침</span></p>
    </div>
    <div class="load-overlay" id="loadOv" style="display:none">
      <div class="spinner" id="spinner"></div>
      <div class="load-title" id="loadTitle">로딩 중...</div>
      <div class="pbar-bg"><div class="pbar-fill" id="pbar"></div></div>
      <div class="pbar-text" id="ptext">준비 중...</div>
    </div>
    <div class="hud">
      <span id="fpsEl">FPS: --</span>
      <span style="color:#B0B7BE">좌:회전 &nbsp; 우:이동 &nbsp; 휠:줌</span>
    </div>
    <div id="miniMap" style="position:absolute;right:12px;bottom:12px;background:rgba(247,248,249,.92);border:1px solid var(--line);border-radius:2px;padding:6px 6px 3px;user-select:none">
      <canvas id="miniCv" width="188" height="104" style="display:block"></canvas>
      <div style="display:flex;align-items:center;justify-content:space-between;margin-top:3px">
        <span id="miniLbl" style="font-size:9px;color:var(--ink3);font-family:var(--mono)">-</span>
        <span id="miniClear" style="font-size:9px;color:var(--ink3);font-family:var(--mono);cursor:pointer;padding:0 2px">궤적 지우기</span>
      </div>
    </div>
    <div id="fallBanner" style="position:absolute;top:12px;left:50%;transform:translateX(-50%);background:#B33;color:#fff;padding:6px 18px;border-radius:2px;font-size:12px;font-weight:700;letter-spacing:.1em;display:none;pointer-events:none">넘어졌습니다</div>
    <div id="vpTools">
      <button class="zb" id="zoomIn"  title="확대">&#xFF0B;</button>
      <button class="zb" id="zoomOut" title="축소">&#xFF0D;</button>
      <button class="zb" id="zoomFit" title="화면에 맞추기">&#x2922;</button>
    </div>
    <div class="tooltip" id="tt"></div>
  </div>

  <div class="right">
    <div class="right-head">
      <b>관절</b>
      <input class="search-box" id="searchBox" placeholder="검색" type="text">
      <span class="jcount" id="jcount">-</span>
    </div>
    <div class="joints" id="jointsEl">
      <div class="no-joint">URDF 로드 후 관절 표시</div>
    </div>
  </div>
</div>

<div class="timeline-panel">
  <div class="tl-controls">
    <button class="tl-btn" id="tlToStart" title="처음">&#x23EE;</button>
    <button class="tl-btn" id="tlPlayPause" title="재생/정지">&#x25B6;</button>
    <button class="tl-btn" id="tlStop" title="정지">&#x25A0;</button>
    <span class="tl-time-display" id="tlTimeDisp">0.00s</span>
    <div class="tl-sep"></div>
    <button class="tl-btn accent" id="tlAddKf">+ 키프레임</button>
    <button class="tl-btn danger" id="tlDelKf">&#x2715; 삭제</button>
    <div class="tl-sep"></div>
    <span class="tl-label">길이</span>
    <input class="tl-dur" id="tlDurInput" type="number" value="5" min="0.5" max="120" step="0.1">
    <span class="tl-label">s · 속도</span>
    <select class="tl-select" id="tlSpeedSel">
      <option value="0.25">0.25×</option>
      <option value="0.5">0.5×</option>
      <option value="0.75">0.75×</option>
      <option value="1" selected>1×</option>
      <option value="1.25">1.25×</option>
      <option value="1.5">1.5×</option>
      <option value="1.75">1.75×</option>
      <option value="2">2×</option>
    </select>
    <button class="tl-btn" id="tlLoopBtn">&#x1F501; 루프</button>
    <div class="tl-sep"></div>
    <button class="tl-btn" id="tlSaveMotion">&#x1F4BE; 저장</button>
    <select class="tl-select" id="motionPick" title="내장 모션 불러오기" style="max-width:150px">
      <option value="">모션 선택</option>
    </select>
    <button class="tl-btn" id="tlLoadMotion">&#x1F4C2; 불러오기</button>
    <input type="file" id="motionFileIn" accept=".json">
    <span class="tl-kf-count" id="tlKfCount">키프레임 0</span>
  </div>
  <div class="tl-body">
    <div class="tl-canvas-wrap" id="tlWrap">
      <canvas id="tlCanvas"></canvas>
    </div>
  </div>
</div>

<script src="js/config.js"></script>
<script src="js/dom.js"></script>
<script src="js/orbit.js"></script>
<script src="js/loaders.js"></script>
<script src="js/viewer.js"></script>
<script src="js/physics.js"></script>
<script src="js/backdrop.js"></script>
<script src="js/motion.js"></script>
<script src="js/pibo_api.js"></script>
<script src="js/motion_names.js"></script>
<script src="js/appview.js"></script>

<script type="module">
  // Rapier3D — lib/rapier.es.js 를 먼저 쓰고, 없을 때만 CDN
  const SOURCES = [
    './lib/rapier.es.js',
    'https://cdn.jsdelivr.net/npm/@dimforge/rapier3d-compat@0.14.0/rapier.es.js'
  ];
  let RAPIER = null;
  for (const src of SOURCES) {
    try {
      const mod = await import(src);
      const cand = (mod && mod.default) ? mod.default : mod;
      if (cand && typeof cand.init === 'function') { RAPIER = cand; console.log('Rapier:', src); break; }
    } catch (e) { console.warn('Rapier load failed:', src, e.message); }
  }
  if (RAPIER) {
    try {
      await RAPIER.init();
      window.RAPIER = RAPIER;
      window.dispatchEvent(new Event('rapier-ready'));
    } catch (e) { console.error(e); window.dispatchEvent(new Event('rapier-fail')); }
  } else {
    window.dispatchEvent(new Event('rapier-fail'));
  }
</script>
</body>
</html>
