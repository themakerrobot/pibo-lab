<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>파이보 랩 — 체험툴</title>
<meta name="description" content="브라우저에서 PIBO 휴머노이드 로봇을 조작하고 모션을 만들어 보세요.">
<meta property="og:title" content="파이보 랩">
<meta property="og:description" content="브라우저에서 PIBO를 조작하고 모션을 만들어 실물 로봇으로 내보내기">
<meta property="og:image" content="img/og.png">
<link rel="icon" type="image/png" href="img/favicon.png">
<link rel="stylesheet" href="fonts/pretendard.css?v=7">
<link rel="stylesheet" href="css/all.min.css?v=7">
<script src="lib/three.min.js?v=7"></script>
<link rel="stylesheet" href="css/style.css?v=7">
</head>
<body>
<header>
  <h1><img src="img/pibo-logo.png" alt="PIBO">파이보 랩</h1>
  <span class="navlink on">체험툴</span>
  <a class="navlink" href="dev.html">개발툴</a>
  <a class="navlink" href="game.html">게임툴</a>
  <span class="badge" id="statusBadge">준비</span>
  <span style="flex:1"></span>
</header>

<div class="main">
  <div class="left">
    <div class="sec">
      <div class="sec-title">뷰</div>
      <select class="tl-select" id="themeSel" style="width:100%;margin-bottom:6px"><option value="desk">배경: 책상</option><option value="dining">배경: 식탁</option><option value="bench">배경: 작업대</option><option value="road">배경: 주행 매트</option><option value="sumo">배경: 스모 링</option><option value="soccer">배경: 축구장</option><option value="space">배경: 우주 기지</option><option value="kitchen">배경: 주방 조리대</option><option value="plain">배경: 심플</option></select>
      <button class="tb on" id="gridBtn"><i class="ic fa-solid fa-border-all"></i>그리드</button>
      <button class="tb" id="ssBtn"><i class="ic fa-solid fa-camera"></i>스크린샷</button>
    </div>
    <div class="sec">
      <div class="sec-title">포즈</div>
      <button class="tb" id="resetBtn"><i class="ic fa-solid fa-rotate-left"></i>리셋</button>
    </div>
    <div class="sec">
      <div class="sec-title">LCD</div>
      <input type="text" id="lcdText" placeholder="Hi, pibo" style="width:100%;padding:7px 9px;background:var(--panel2);border:1px solid var(--line-soft);border-radius:8px;font-size:12px;color:var(--ink);outline:none;font-family:var(--sans);margin-bottom:6px">
      <div style="display:flex;align-items:center;gap:6px;font-size:11px;color:var(--ink3)"><span>글씨색</span><input type="color" id="lcdColor" value="#ffffff" style="flex:1;height:26px;border:1px solid var(--line-soft);border-radius:6px;background:var(--panel2);cursor:pointer;padding:2px"></div>
    </div>
    <div class="sec">
      <div class="sec-title">안경</div>
      <div style="display:flex;gap:5px"><input type="color" id="glassColorL" value="#00e1ff" title="왼쪽 눈"  style="flex:1;height:30px;border:1px solid var(--line-soft);border-radius:6px;background:var(--panel2);cursor:pointer;padding:2px"><input type="color" id="glassColorR" value="#00e1ff" title="오른쪽 눈" style="flex:1;height:30px;border:1px solid var(--line-soft);border-radius:6px;background:var(--panel2);cursor:pointer;padding:2px"></div>
    </div>
    <div class="sec">
      <div class="sec-title">물리 시뮬</div>
      <button class="tb" id="physBtn" disabled><i class="ic fa-solid fa-bolt"></i>물리 ON/OFF</button>
      <div class="info-row"><span>엔진</span><span class="info-val" id="physEngine">로딩중</span></div>
      <div class="info-row"><span>상태</span><span class="info-val" id="physState">OFF</span></div>
      <div class="info-row"><span>기울기</span><span class="info-val" id="physTilt">-</span></div>
      <div class="info-row"><span>이동거리</span><span class="info-val" id="physDist">-</span></div>
    </div>
    <div class="sec" id="partColorSec" style="display:none">
      <div class="sec-title">파트 색상</div>
      <div id="partColors"></div>
      <button class="tb" id="partResetBtn" style="margin-top:6px"><i class="ic fa-solid fa-rotate-left"></i>색상 되돌리기</button>
    </div>
    <div class="sec" id="infoSec" style="display:none"><div id="infoRows"></div></div>
  </div>

  <div class="viewport" id="vp">
    <canvas id="cv"></canvas>
    <div class="empty-msg" id="emptyMsg">
      <div class="em-icon" style="opacity:1"><img src="img/pibo-oops.png" alt=""></div>
      <p class="em-msg">모델을 불러오지 못했어요<br><span style="font-size:11px;color:var(--ink3);font-weight:400">잠시 후 새로고침해 주세요</span></p>
    </div>
    <div class="load-overlay" id="loadOv" style="display:none">
      <img class="load-char" src="img/pibo-hello.png" alt="">
      <div class="spinner" id="spinner"></div>
      <div class="load-title" id="loadTitle">파이보를 불러오고 있어요</div>
      <div class="pbar-bg"><div class="pbar-fill" id="pbar"></div></div>
      <div class="pbar-text" id="ptext">준비 중...</div>
    </div>
    <div class="hud">
      <span id="fpsEl">FPS: --</span>
      <span style="color:var(--ink3)">좌:회전 &nbsp; 우:이동 &nbsp; 휠:줌</span>
    </div>
    <div id="miniMap" style="position:absolute;right:12px;bottom:12px;background:rgba(255,255,255,.94);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);padding:7px 7px 4px;user-select:none">
      <canvas id="miniCv" width="188" height="104" style="display:block;border-radius:5px"></canvas>
      <div style="display:flex;align-items:center;justify-content:space-between;margin-top:4px">
        <span id="miniLbl" class="num" style="font-size:10px;color:var(--ink3)">-</span>
        <span id="miniClear" style="font-size:10px;font-weight:600;color:var(--ink3);cursor:pointer;padding:0 2px">궤적 지우기</span>
      </div>
    </div>
    <div id="fallBanner" style="display:none"><img src="img/pibo-fall.png" alt=""><span class="fb-txt">넘어졌어요!</span></div>
    <div id="vpTools">
      <button class="zb" id="zoomIn"  title="확대"><i class="fa-solid fa-plus"></i></button>
      <button class="zb" id="zoomOut" title="축소"><i class="fa-solid fa-minus"></i></button>
      <button class="zb" id="zoomFit" title="화면에 맞추기"><i class="fa-solid fa-expand"></i></button>
    </div>
    <div class="tooltip" id="tt"></div>
  </div>

  <div class="right">
    <div class="right-head">
      <b>관절</b>
      <input class="search-box" id="searchBox" placeholder="검색" type="text">
      <span class="jcount" id="jcount">-</span>
    </div>
    <div class="joints" id="jointsEl">
      <div class="no-joint">URDF 로드 후 관절 표시</div>
    </div>
  </div>
</div>

<div class="timeline-panel">
  <div class="tl-controls">
    <button class="tl-btn" id="tlToStart" title="처음"><i class="fa-solid fa-backward-step"></i></button>
    <button class="tl-btn" id="tlPlayPause" title="재생/정지">▶</button>
    <button class="tl-btn" id="tlStop" title="정지"><i class="fa-solid fa-stop"></i></button>
    <span class="tl-time-display" id="tlTimeDisp">0.00s</span>
    <div class="tl-sep"></div>
    <button class="tl-btn accent" id="tlAddKf">+ 키프레임</button>
    <button class="tl-btn danger" id="tlDelKf"><i class="fa-solid fa-xmark"></i> 삭제</button>
    <div class="tl-sep"></div>
    <span class="tl-label">길이</span>
    <input class="tl-dur" id="tlDurInput" type="number" value="5" min="0.5" max="120" step="0.1">
    <span class="tl-label">s · 속도</span>
    <select class="tl-select" id="tlSpeedSel">
      <option value="0.25">0.25×</option>
      <option value="0.5">0.5×</option>
      <option value="0.75">0.75×</option>
      <option value="1" selected>1×</option>
      <option value="1.25">1.25×</option>
      <option value="1.5">1.5×</option>
      <option value="1.75">1.75×</option>
      <option value="2">2×</option>
    </select>
    <button class="tl-btn" id="tlLoopBtn"><i class="fa-solid fa-repeat"></i> 루프</button>
    <div class="tl-sep"></div>
    <button class="tl-btn" id="tlSaveMotion"><i class="fa-solid fa-floppy-disk"></i> 저장</button>
    <select class="tl-select" id="motionPick" title="내장 모션 불러오기" style="max-width:150px">
      <option value="">모션 선택</option>
    </select>
    <button class="tl-btn" id="tlLoadMotion"><i class="fa-solid fa-folder-open"></i> 불러오기</button>
    <input type="file" id="motionFileIn" accept=".json">
    <span class="tl-kf-count" id="tlKfCount">키프레임 0</span>
  </div>
  <div class="tl-body">
    <div class="tl-canvas-wrap" id="tlWrap">
      <canvas id="tlCanvas"></canvas>
    </div>
  </div>
</div>

<script src="js/i18n.js?v=7"></script>
<script src="js/config.js?v=7"></script>
<script src="js/dom.js?v=7"></script>
<script src="js/orbit.js?v=7"></script>
<script src="js/loaders.js?v=7"></script>
<script src="js/viewer.js?v=7"></script>
<script src="js/physics.js?v=7"></script>
<script src="js/backdrop.js?v=7"></script>
<script src="js/motion.js?v=7"></script>
<script src="js/pibo_api.js?v=7"></script>
<script src="js/custom_style.js?v=7"></script>
<script src="js/motion_names.js?v=7"></script>
<script src="js/appview.js?v=7"></script>

<script type="module">
  // Rapier3D — lib/rapier.es.js 를 먼저 쓰고, 없을 때만 CDN
  const SOURCES = [
    './lib/rapier.es.js',
    'https://cdn.jsdelivr.net/npm/@dimforge/rapier3d-compat@0.14.0/rapier.es.js'
  ];
  let RAPIER = null;
  for (const src of SOURCES) {
    try {
      const mod = await import(src);
      const cand = (mod && mod.default) ? mod.default : mod;
      if (cand && typeof cand.init === 'function') { RAPIER = cand; console.log('Rapier:', src); break; }
    } catch (e) { console.warn('Rapier load failed:', src, e.message); }
  }
  if (RAPIER) {
    try {
      await RAPIER.init();
      window.RAPIER = RAPIER;
      window.dispatchEvent(new Event('rapier-ready'));
    } catch (e) { console.error(e); window.dispatchEvent(new Event('rapier-fail')); }
  } else {
    window.dispatchEvent(new Event('rapier-fail'));
  }
</script>
</body>
</html>
