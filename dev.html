<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>파이보 랩 — 개발툴</title>
<link rel="stylesheet" href="css/all.min.css?v=9">
<link rel="icon" type="image/png" href="img/favicon.png">
<link rel="stylesheet" href="fonts/pretendard.css?v=9">
<link rel="stylesheet" href="css/style.css?v=9">
<style>
  html,body{height:100%;margin:0;overflow:hidden}
  #devTop{height:54px;display:flex;align-items:center;gap:8px;padding:0 14px;
    background:var(--panel,#FFFFFF);border-bottom:1px solid var(--line,#DDE6EA);flex-shrink:0;
    font-family:var(--sans,-apple-system,'Segoe UI',sans-serif);font-size:12.5px}
  #devTop .title{font-size:15.5px;color:var(--ink,#233642);font-weight:800;letter-spacing:-.01em;height:100%;display:flex;align-items:center;gap:9px;padding-right:14px}
  #devTop .sp{flex:1}
  .db{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line,#DDE6EA);background:var(--panel,#fff);color:var(--ink2,#5C6E79);border-radius:8px;
    padding:6px 12px;font-size:12.5px;font-weight:600;cursor:pointer;font-family:inherit;transition:all .12s}
  .db:hover{border-color:var(--acc,#00BEDC);color:var(--acc-ink,#0090A9);background:var(--acc-soft,#E1F7FB)}
  .db:disabled{opacity:.4;cursor:default}
  .db.run{background:var(--ok,#2E9E63);color:#fff;border-color:var(--ok,#2E9E63)}
  .db.run:hover{background:#27884F;border-color:#27884F;color:#fff}
  .db.stop{background:var(--warn,#E2574C);color:#fff;border-color:var(--warn,#E2574C)}
  .db.stop:hover{background:#C94A40;border-color:#C94A40;color:#fff}
  #devMain{display:flex;height:calc(100% - 54px);min-width:0}
  #blocklyDiv{flex:1;min-width:280px}
  /* 좌우 분할선 — 드래그로 폭 조절 */
  #devSplit{width:6px;cursor:col-resize;background:var(--line,#DDE1E4);flex-shrink:0}
  #devSplit:hover,#devSplit.on{background:#8FA6B8}
  #devRight{width:46vw;min-width:420px;max-width:70vw;display:flex;flex-direction:column;flex-shrink:0}
  #vp{flex:1;position:relative;min-height:180px}
  /* 콘솔 위 분할선 — 드래그로 높이 조절 */
  #devHSplit{height:6px;cursor:row-resize;background:var(--line,#DDE1E4);flex-shrink:0}
  #devHSplit:hover,#devHSplit.on{background:#8FA6B8}
  #devConsole{height:190px;flex-shrink:0;overflow-y:auto;background:#1B1E21;color:#C9D1D9;
    font-family:var(--mono,'IBM Plex Mono','Nanum Gothic Coding',ui-monospace,monospace);font-size:12px;line-height:1.75;padding:8px 12px}
  @media (max-width:1200px){ #devRight{width:50vw;min-width:340px} }
  @media (max-width:900px){
    #devMain{flex-direction:column}
    #devSplit{display:none}
    #devRight{width:auto;max-width:none;min-width:0;height:55%;border-top:1px solid var(--line,#DDE1E4)}
    #blocklyDiv{min-height:220px}
  }
  #devConsole .warn{color:#E0B84C}
  #devConsole .err{color:#F08080}
  #devStatus{display:flex;gap:14px;padding:5px 10px;font-size:11px;
    font-family:var(--mono,'IBM Plex Mono','Nanum Gothic Coding',ui-monospace,monospace);color:#6B7278;
    border-top:1px solid var(--line,#DDE1E4);border-bottom:1px solid var(--line,#DDE1E4)}
  /* 뷰어 위에 얹는 도구 */
  #vpTools{position:absolute;right:10px;top:10px;z-index:20;display:flex;flex-direction:column;gap:6px;align-items:flex-end}
  #vpTools select{font-family:var(--mono,'IBM Plex Mono','Nanum Gothic Coding',ui-monospace,monospace);font-size:11px;padding:4px 6px;
    border:1px solid rgba(0,0,0,.18);border-radius:2px;background:rgba(255,255,255,.92);cursor:pointer}
  #vpTools .zb{width:30px;height:30px;font-size:15px;line-height:1;
    border:1px solid rgba(0,0,0,.18);border-radius:2px;background:rgba(255,255,255,.92);
    cursor:pointer;color:#333;padding:0}
  #vpTools .zb:hover{background:#fff}
  .stubs{display:none}
</style>
</head>
<body>

<div id="devTop">
  <span class="title"><img src="img/pibo-logo.png" alt="" style="height:30px">파이보 랩</span>
  <a class="navlink" href="index.html">체험툴</a>
  <span class="navlink on">개발툴</span>
  <a class="navlink" href="game.html">게임툴</a>
  <span style="width:1px;height:20px;background:var(--line-soft,#E7EEF1)"></span>
  <button class="db run" id="btnRun"><i class="fa-solid fa-play"></i> 실행</button>
  <button class="db stop" id="btnStop" disabled><i class="fa-solid fa-stop"></i> 정지</button>
  <button class="db" id="btnReset" title="관절·화면·물리를 처음 상태로"><i class="fa-solid fa-rotate-left"></i> 로봇 초기화</button>
  <button class="db" id="btnClear" title="작업 중인 블록을 모두 지웁니다"><i class="fa-solid fa-trash-can"></i> 블록 지우기</button>
  <span class="sp"></span>
  <button class="db" id="btnSave"><i class="fa-solid fa-floppy-disk"></i> 저장</button>
  <button class="db" id="btnLoad"><i class="fa-solid fa-folder-open"></i> 불러오기</button>
  <input type="file" id="fileIn" accept=".json,.xml" style="display:none">
</div>

<div id="devMain">
  <div id="blocklyDiv"></div>
  <div id="devSplit" title="드래그해서 폭 조절"></div>
  <div id="devRight">
    <div id="vp">
      <canvas id="cv"></canvas>
      <div id="fallBanner" style="display:none"><img src="img/pibo-fall.png" alt=""><span class="fb-txt">넘어졌어요!</span></div>
      <div class="load-ov" id="loadOv">
        <div class="load-box">
          <div class="spinner" id="spinner"></div>
          <div class="load-title" id="loadTitle">불러오는 중</div>
          <div class="pbar-wrap"><div class="pbar" id="pbar"></div></div>
          <div class="ptext" id="ptext"></div>
        </div>
      </div>
      <div class="empty-msg" id="emptyMsg" style="display:none">모델 없음</div>
      <div id="vpTools">
        <select id="themePick" title="배경 테마">
          <option value="desk">책상</option>
          <option value="dining">식탁</option>
          <option value="bench">작업대</option>
          <option value="road">주행 매트</option>
          <option value="sumo">스모 링</option>
          <option value="soccer">축구장</option>
          <option value="space">우주 기지</option>
          <option value="kitchen">주방 조리대</option>
          <option value="plain">심플</option>
        </select>
        <button class="zb" id="zoomIn"  title="확대">＋</button>
        <button class="zb" id="zoomOut" title="축소">－</button>
        <button class="zb" id="zoomFit" title="화면에 맞추기">⤢</button>
      </div>
    </div>
    <div id="devStatus">
      <span>엔진 <b id="physEngine">로딩중</b></span>
      <span>물리 <b id="physState">OFF</b></span>
      <span>기울기 <b id="physTilt">-</b></span>
      <span>이동 <b id="physDist">-</b></span>
      <span id="fpsEl">FPS: -</span>
    </div>
    <div id="devHSplit" title="드래그해서 높이 조절"></div>
    <div id="devConsole"></div>
  </div>
</div>

<!-- viewer.js / physics.js 가 참조하는 체험툴 전용 요소들 (개발툴에선 화면에 안 보임) -->
<div class="stubs">
  <span id="statusBadge"></span><div id="infoSec"></div><div id="infoRows"></div>
  <div id="jointsEl"></div><span id="jcount"></span>
  <input id="lcdText" value=""><input type="color" id="lcdColor" value="#ffffff">
  <input type="color" id="glassColor" value="#00e1ff">
  <span id="tlTimeDisp"></span><span id="tlPlayPause"></span>
  <button id="physBtn"></button><button id="gridBtn"></button>
</div>

<script src="lib/three.min.js?v=9"></script>

<!-- 시뮬레이터 (체험툴과 완전히 같은 파일) -->
<script src="js/i18n.js?v=9"></script>
<script src="js/config.js?v=9"></script>
<script src="js/dom.js?v=9"></script>
<script src="js/orbit.js?v=9"></script>
<script src="js/loaders.js?v=9"></script>
<script src="js/viewer.js?v=9"></script>
<script src="js/physics.js?v=9"></script>
<script src="js/backdrop.js?v=9"></script>
<script src="js/motion.js?v=9"></script>
<script src="js/pibo_api.js?v=9"></script>
<script src="js/custom_style.js?v=9"></script>
<script src="js/pibo_oled.js?v=9"></script>
<script src="js/motion_names.js?v=9"></script>

<!-- Blockly (실물 IDE 와 같은 10.0.0 빌드 + 같은 블록 정의) -->
<script src="blockly/blockly_compressed.js"></script>
<script src="blockly/blocks_compressed.js"></script>
<script src="blockly/javascript_compressed.js"></script>
<!-- 실물 IDE 와 같은 번역 테이블. lang(ko/en) 을 여기서 정한다 -->
<script src="blockly/ko2en.js"></script>
<script>document.write('<scr' + 'ipt src="blockly/' + (lang === 'en' ? 'en' : 'ko') + '.js"><\/scr' + 'ipt>');</script>
<script src="blockly/customblock.js"></script>
<!-- 시작 블록에 연결되지 않은 블록은 자동 비활성화 (실물 IDE 와 동일) -->
<script src="blockly/disable-top-blocks.js"></script>
<script src="blockly/js-interpreter.js"></script>

<script src="js/blockly_theme.js?v=9"></script>
<script src="js/toolbox_sim.js?v=9"></script>
<script src="js/generator_js.js?v=9"></script>
<script src="js/blockly_run.js?v=9"></script>

<script>
// ── Blockly 워크스페이스 ──
Blockly.setLocale && Blockly.setLocale(Blockly.Msg);
// 실물 IDE 와 같은 테마 / 렌더러 / 옵션 (js/blockly_theme.js)
const devWorkspace = Blockly.inject('blocklyDiv',
  Object.assign({}, PIBO_BLOCKLY_OPTIONS, { toolbox: SIM_TOOLBOX, media: 'blockly/media/' }));

// 실물 IDE 와 동일: '시작' 블록에 연결되지 않은 블록은 비활성 → 코드에도 안 들어간다
if (typeof DisableTopBlocks === 'function') new DisableTopBlocks(devWorkspace).init();

// '시작' 블록은 하나만 — 실물 IDE 와 동일하게 두 번째부터는 자동 삭제
devWorkspace.addChangeListener(ev => {
  if (ev.type !== Blockly.Events.CREATE) return;
  const flags = devWorkspace.getAllBlocks(false).filter(b => b.type === 'flag_event');
  if (flags.length > 1) {
    const b = devWorkspace.getBlockById(ev.ids[0]);
    if (b && b.type === 'flag_event') { b.dispose(); devLog("'시작' 블록은 하나만 쓸 수 있습니다.", 'warn'); }
  }
});
const relayout = () => Blockly.svgResize(devWorkspace);
window.addEventListener('resize', relayout);

// 분할선 드래그 (좌우 / 상하)
function makeSplitter(handleId, onDrag){
  const h = document.getElementById(handleId);
  if(!h) return;
  h.addEventListener('pointerdown', e => {
    e.preventDefault();
    h.classList.add('on');
    h.setPointerCapture(e.pointerId);
    const move = ev => { onDrag(ev); relayout(); };
    const up = ev => {
      h.classList.remove('on');
      h.releasePointerCapture(ev.pointerId);
      h.removeEventListener('pointermove', move);
      h.removeEventListener('pointerup', up);
      relayout();
    };
    h.addEventListener('pointermove', move);
    h.addEventListener('pointerup', up);
  });
}
makeSplitter('devSplit', ev => {
  const w = window.innerWidth - ev.clientX;
  document.getElementById('devRight').style.width =
    Math.max(340, Math.min(window.innerWidth - 300, w)) + 'px';
});
makeSplitter('devHSplit', ev => {
  const right = document.getElementById('devRight').getBoundingClientRect();
  const hgt = right.bottom - ev.clientY;
  document.getElementById('devConsole').style.height =
    Math.max(60, Math.min(right.height - 200, hgt)) + 'px';
});

// ── 저장 / 불러오기 (실물 IDE 와 같은 workspace JSON) ──
document.getElementById('btnSave').addEventListener('click', () => {
  // 실물 IDE 와 같은 workspace JSON
  const text = JSON.stringify(Blockly.serialization.workspaces.save(devWorkspace), null, 1);
  const name = 'pibo_blocks.json';
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], { type: 'application/json' }));
  a.download = name;
  a.click();
  URL.revokeObjectURL(a.href);
  devLog('저장: ' + name);
});
document.getElementById('btnLoad').addEventListener('click', () => document.getElementById('fileIn').click());
document.getElementById('fileIn').addEventListener('change', e => {
  const f = e.target.files[0]; if (!f) return;
  const fr = new FileReader();
  fr.onload = ev => {
    const txt = String(ev.target.result).trim();
    try {
      if (txt.startsWith('<')) {                       // 실물 IDE 가 XML 로 저장한 경우
        Blockly.Xml.domToWorkspace(Blockly.utils.xml.textToDom(txt), devWorkspace);
      } else {
        Blockly.serialization.workspaces.load(JSON.parse(txt), devWorkspace);
      }
      devLog('불러오기 완료: ' + f.name);
    } catch (err) { devLog('불러오기 실패: ' + err.message, 'err'); }
  };
  fr.readAsText(f);
  e.target.value = '';
});


// ── 버튼 ──
document.getElementById('btnRun').addEventListener('click', devRun);
document.getElementById('btnStop').addEventListener('click', devStop);
document.getElementById('btnReset').addEventListener('click', () => {
  devStop();
  for (const jn in sliderEls) { sliderEls[jn].value = 0; setJointValue(jn, 0); }
  Oled.reset();
  if (typeof PHYS !== 'undefined' && PHYS.on) PHYS.reset();
  devLog('로봇 초기화');
});

// ── 확대 / 축소 / 맞추기 ──
function zoomBy(f){
  if(typeof orbit === 'undefined') return;
  orbit.r = Math.max(0.15, Math.min(60, orbit.r * f));
  orbit.update();
}
document.getElementById('zoomIn').addEventListener('click',  () => zoomBy(0.82));
document.getElementById('zoomOut').addEventListener('click', () => zoomBy(1.22));
document.getElementById('zoomFit').addEventListener('click', () => {
  if(typeof robotRoot !== 'undefined' && robotRoot)
    orbit.focusBox(new THREE.Box3().setFromObject(robotRoot));
});

// ── 배경 테마 ──
document.getElementById('themePick').addEventListener('change', function(){
  if(typeof setTheme === 'function') setTheme(this.value);
});

// ── 작업 중인 블록 자동 보관 (탭을 닫으면 사라짐) ──
// 실수로 새로고침해도 이어서 작업할 수 있게. 저장 형식은 파일 저장과 동일한 workspace JSON.
const AUTOSAVE_KEY = 'pibo-dev-blocks-v1';
let restoring = false;      // 복원 중에는 저장하지 않는다 (복원 이벤트가 저장을 다시 부르는 것 방지)
let saveTimer = null;

function autosave() {
  if (restoring) return;
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {                 // 드래그 중 매번 저장하지 않도록 지연
    try {
      const json = Blockly.serialization.workspaces.save(devWorkspace);
      const empty = !json.blocks || !json.blocks.blocks || !json.blocks.blocks.length;
      empty ? sessionStorage.removeItem(AUTOSAVE_KEY)
            : sessionStorage.setItem(AUTOSAVE_KEY, JSON.stringify(json));
    } catch (e) { /* 저장 실패는 조용히 넘어간다 */ }
  }, 800);
}

function restoreBlocks() {
  let raw;
  try { raw = sessionStorage.getItem(AUTOSAVE_KEY); } catch (e) { return false; }
  if (!raw) return false;
  restoring = true;
  try {
    Blockly.serialization.workspaces.load(JSON.parse(raw), devWorkspace);
    const n = devWorkspace.getAllBlocks(false).length;
    devLog('이전에 하던 작업을 불러왔습니다 (블록 ' + n + '개). 새로 시작하려면 [블록 지우기]');
    return true;
  } catch (e) {
    devLog('이전 작업을 복원하지 못했습니다: ' + e.message, 'warn');
    try { sessionStorage.removeItem(AUTOSAVE_KEY); } catch (e2) {}
    return false;
  } finally {
    restoring = false;
    // 복원 도중 잠시 고아 상태였던 블록들의 활성/비활성을 다시 계산시킨다
    devWorkspace.getAllBlocks(false).forEach(b => { delete b.userDisabled; });
    devWorkspace.fireChangeListener(new Blockly.Events.BlockMove(devWorkspace.getTopBlocks(false)[0]));
  }
}

document.getElementById('btnClear').addEventListener('click', () => {
  if (devWorkspace.getAllBlocks(false).length && !confirm('작업 중인 블록을 모두 지울까요?')) return;
  devStop();
  devWorkspace.clear();
  try { sessionStorage.removeItem(AUTOSAVE_KEY); } catch (e) {}
  devLog('블록을 모두 지웠습니다');
});

const restored = restoreBlocks();
devWorkspace.addChangeListener(ev => { if (!ev.isUiEvent) autosave(); });

devLog(restored ? '준비 완료 — ▶ 실행을 누르세요'
                : '준비 완료 — 블록을 조립하고 ▶ 실행을 누르세요');
</script>

<script type="module">
  const SOURCES = ['./lib/rapier.es.js',
    'https://cdn.jsdelivr.net/npm/@dimforge/rapier3d-compat@0.14.0/rapier.es.js'];
  let RAPIER = null;
  for (const src of SOURCES) {
    try {
      const mod = await import(src);
      const cand = (mod && mod.default) ? mod.default : mod;
      if (cand && typeof cand.init === 'function') { RAPIER = cand; break; }
    } catch (e) { console.warn('Rapier load failed:', src, e.message); }
  }
  if (RAPIER) {
    try { await RAPIER.init(); window.RAPIER = RAPIER; window.dispatchEvent(new Event('rapier-ready')); }
    catch (e) { console.error(e); window.dispatchEvent(new Event('rapier-fail')); }
  } else window.dispatchEvent(new Event('rapier-fail'));
</script>
</body>
</html>
